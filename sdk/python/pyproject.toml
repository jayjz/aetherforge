[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherforge-client"
version = "0.7.1"
description = "Auto-generated Python client SDK for the AetherForge API"
authors = [{ name = "dantrader" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.20.0",
    "pydantic>=2.0.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/jayjz/aetherforge"
Repository = "https://github.com/jayjz/aetherforge.git"

[tool.hatch.build.targets.wheel]
packages = ["aetherforge_hypervisor_api_client"]
